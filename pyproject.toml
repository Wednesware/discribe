[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "discribe"
version = "0.1.1"
description = "Two ways to write. One place to create."
requires-python = ">=3.12"
dependencies = ["wwn>=26.66"]

[project.optional-dependencies]
desktop = ["pywebview>=6", "PySide6>=6.8", "qtpy>=2.4"]
collaboration = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "pycrdt>=0.12"]
test = ["pytest>=8", "httpx>=0.28", "fastapi>=0.115", "uvicorn>=0.34", "pycrdt>=0.12"]

[project.scripts]
discribe = "discribe.__main__:main"

[tool.setuptools.packages.find]
include = ["discribe*"]

[tool.setuptools.package-data]
discribe = ["web/*", "web/**/*"]
